[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "background-remover"
version = "0.1.0"
description = "A local, offline desktop application for removing image backgrounds"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Background Remover Contributors" }]
dependencies = [
  "rembg[cpu]>=2.0.60,<3",
  "Pillow>=10.0.0,<13",
]

[project.urls]
Homepage = "https://github.com/OWNER/REPOSITORY"
Repository = "https://github.com/OWNER/REPOSITORY"
Issues = "https://github.com/OWNER/REPOSITORY/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
