name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: background-remover-windows
          - platform: ubuntu
            os: ubuntu-22.04
            artifact: background-remover-ubuntu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Download u2net model
        run: python scripts/download_model.py

      - name: Build executable
        run: python scripts/build_app.py

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: python scripts/package_deb.py "${{ github.ref_name }}"

      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item dist/background-remover.exe "background-remover-windows-x64.exe"

      - name: Prepare Ubuntu asset
        if: runner.os == 'Linux'
        run: mv "dist/background-remover_$(echo '${{ github.ref_name }}' | sed 's/^v//')_amd64.deb" dist/background-remover-ubuntu-amd64.deb

      - name: Include notices with build
        shell: bash
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Background Remover ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
